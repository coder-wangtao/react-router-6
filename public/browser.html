<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="root"></div>
    <ul>
      <li><a onclick="pushA()">/a</a></li>
      <li><a onclick="pushB()">/b</a></li>
      <li><a onclick="pushC()">/c</a></li>
      <li><a onclick="forward()">forward</a></li>
      <li><a onclick="back()">back</a></li>
      <li><a onclick="go(1)">go(1)</a></li>
      <li><a onclick="go(-1)">go(-1)</a></li>
    </ul>
    <script>
      //这段代码封装了history.pushState方法，替换了默认的pushState方法，使得每次调用pushState时，都会手动触发onpopstate事件。
      //pushState方法用来修改浏览器历史记录，而不进行页面刷新。

      // history.pushState 是 HTML5 中 History API 提供的一个方法，用于在不刷新页面的情况下修改浏览器的历史记录。
      // 它允许你添加一个新的历史记录条目，这样当用户点击浏览器的“后退”或“前进”按钮时，可以在页面之间切换。
      (function (history) {
        let oldPushState = history.pushState;
        history.pushState = function () {
          let result = oldPushState.apply(history, arguments);
          if (typeof window.onpopstate === "function") {
            //自己手动触发window.onpopstate
            window.onpopstate(new CustomEvent("pushstate"));
          }
          return result;
        };
      })(history);

      window.onpopstate = (event) => {
        root.innerHTML = window.location.pathname;
      };
      function pushA() {
        history.pushState({ name: "a" }, null, "/a");
      }
      function pushB() {
        history.pushState({ name: "b" }, null, "/b");
      }
      function pushC() {
        history.pushState({ name: "c" }, null, "/c");
      }
      function go(n) {
        history.go(n);
      }
      function forward() {
        history.forward();
      }
      function back() {
        history.back();
      }
    </script>
  </body>
</html>
